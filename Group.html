<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- 手機頂部安全區（狀態列）顏色，跟頂部 header 一樣 -->
  <meta name="theme-color" content="#252525">
  <title>Group</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #252525;
      font-family: 'SF Pro', 'SF Pro Text', -apple-system, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: #FFFFFF;
      -webkit-tap-highlight-color: transparent;
    }
    /* 畫面跟著螢幕寬度拉長，物件用 left / right 固定兩側留空 */
    .screen {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background: #212121;
      overflow: hidden;
      animation: screen-in 0.3s ease;
    }
    .screen.is-hidden {
      display: none;
    }
    @keyframes screen-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .abs {
      position: absolute;
    }
    .center-x {
      left: 50%;
      transform: translateX(-50%);
    }
    .shadow {
      box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
    }
    .text-shadow {
      text-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
    }
    .t10 { font-size: 10px; }
    .t12 { font-size: 12px; }
    .t15 { font-size: 15px; }
    .t20 { font-size: 20px; }
    .t30 { font-size: 30px; }
    .nowrap { white-space: nowrap; }
    .avatar {
      position: absolute;
      object-fit: cover;
      box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
    }

    /* ---------- 登入 ---------- */
    .field {
      position: absolute;
      left: 20px;
      right: 20px;
      height: 50px;
      border-radius: 25px;
      background: rgba(65, 65, 65, 0.2);
      box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
    }
    .field input {
      position: absolute;
      left: 65px;
      right: 60px;
      top: 0;
      height: 50px;
      padding: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: #FFFFFF;
      font: inherit;
      font-size: 15px;
      text-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
    }
    .field input::placeholder {
      color: #FFFFFF;
      opacity: 1;
    }
    .field-account { top: 290px; }
    .field-password { top: 385px; }
    .icon-user { left: 25px; top: 15px; width: 20px; height: 20px; }
    .icon-lock { left: 26px; top: 15px; width: 18px; height: 20px; }
    .eye-button {
      position: absolute;
      right: 21px;
      top: 18px;
      width: 20px;
      height: 13px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .eye-button img {
      display: block;
      width: 20px;
      height: 13px;
    }
    .login-button {
      position: absolute;
      left: 20px;
      right: 20px;
      top: 480px;
      height: 50px;
      border: 0;
      border-radius: 25px;
      background: #2949CB;
      box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
      color: #FFFFFF;
      font: inherit;
      font-size: 15px;
      text-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .login-button:active {
      transform: scale(0.97);
    }
    .social {
      top: 575px;
      width: 50px;
      height: 50px;
      border-radius: 25px;
      cursor: pointer;
    }

    /* ---------- 群組主頁 ---------- */
    /* 主頁可以往下滑（Figma 畫面高度 1500 - 60） */
    .screen-home {
      height: 1440px;
    }
    /* 頂部固定，往下滑時不會跟著捲走；底色用不透明的 #252525（= header 疊在背景上的顏色），內容才不會透出來 */
    .header {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      height: 85px;
      background: #252525;
      z-index: 5;
    }
    .group-avatar {
      top: 0px;
      width: 60px;
      height: 60px;
      border-radius: 30px;
    }
    .group-title {
      top: 60px;
    }
    .header-tag {
      right: 20px;
      top: 59px;
      width: 50px;
      height: 20px;
      border-radius: 5px;
      background: rgba(217, 217, 217, 0.2);
    }
    .card {
      position: absolute;
      left: 20px;
      right: 20px;
      border-radius: 35px;
      background: rgba(65, 65, 65, 0.2);
      box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
    }
    /* Liquid Glass（WebGL）載入後由 shader 畫玻璃，拿掉原本的底色跟陰影；載入失敗就維持上面的樣式 */
    .glass-ready .card {
      background: transparent;
      box-shadow: none;
    }
    /* shader 的 canvas 是 z-index: -1，卡片要自成一層，canvas 才不會被壓到背景後面 */
    .card {
      isolation: isolate;
    }
    /* 玻璃後面的背景：root 本身不會被擷取，所以背景要放在子元素 */
    .home-bg {
      position: absolute;
      inset: 0;
      background: #212121 url(assets/home-bg.jpg) center top / cover no-repeat;
    }
    .leader-card {
      top: 109px;
      height: 150px;
    }
    .leader-avatar {
      left: 10px;
      top: 25px;
      width: 100px;
      height: 100px;
      border-radius: 50px;
    }
    .leader-badge {
      right: 20px;
      top: 10px;
      width: 50px;
      height: 20px;
      border-radius: 8px;
      background: rgba(99, 99, 99, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bio-label {
      left: 240px;
      right: 10px;
      top: 35px;
    }
    .bio-box {
      left: 240px;
      right: 10px;
      top: 54px;
      height: 76px;
      border-radius: 10px;
      background: rgba(99, 99, 99, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rank-card {
      top: 283px;
      height: 406px;
    }
    .rank-header {
      left: 0;
      right: 0;
      top: 0;
      height: 50px;
      box-sizing: border-box;
      border-bottom: 1px solid #838383;
      border-radius: 35px 35px 0px 0px;
      background: rgba(53, 53, 53, 0.2);
    }
    .divider {
      left: 0;
      right: 0;
      height: 1px;
      background: #838383;
    }
    .member-avatar {
      left: 10px;
      width: 35px;
      height: 35px;
      border-radius: 17.5px;
    }

    /* Tab Bar - iPhone · 五分頁（可點擊也可滑動） */
    .tab-bar {
      position: fixed;
      left: 19px;
      right: 19px;
      bottom: 29px;
      height: 70px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border-radius: 1000px;
      background: rgba(242, 242, 247, 0.8);
      -webkit-backdrop-filter: blur(20px) saturate(190%);
      backdrop-filter: blur(20px) saturate(190%);
      box-shadow: 1.25px 0px 0px -0.75px #D0D0D0, -1.25px 0px 0px -0.75px #D0D0D0, 0px 0px 0px 0.5px #E8E8E8, 0px 8px 15px 0px rgba(0, 0, 0, 0.02);
      font-family: 'Inter', 'SF Pro', -apple-system, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      z-index: 10;
    }
    .tab-bar[hidden] {
      display: none;
    }
    /* 選取底色：用 transform 移動，點擊跟滑動都有動畫 */
    .tab-pill {
      position: absolute;
      left: 2px;
      top: 5px;
      width: calc(20% - 4px);
      height: 60px;
      border-radius: 30px;
      background: rgba(0, 122, 255, 0.4);
      transform: translateX(var(--pill-x, 0px)) scale(var(--pill-scale, 1));
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }
    .tab-bar.is-dragging .tab-pill {
      --pill-scale: 1.12;
      transition: transform 0.12s ease-out;
    }
    .tab {
      position: relative;
      height: 70px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #1C1C1E;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: color 0.25s ease;
    }
    .tab.is-active {
      color: #007AFF;
    }
    .tab img {
      position: absolute;
      left: 50%;
      top: 14px;
      transform: translateX(-50%);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .tab.is-active img {
      transform: translateX(-50%) scale(1.12);
    }
    .tab span {
      position: absolute;
      left: 50%;
      top: 42px;
      transform: translateX(-50%);
      white-space: nowrap;
    }
    .tab .tab-avatar {
      width: 20px;
      height: 20px;
      border-radius: 50px;
      object-fit: cover;
    }

    /* ---------- VIDEO ---------- */
    .call-title {
      left: 20px;
      top: 15px;
    }
    .call-clock {
      left: 21.5px;
      top: 35.5px;
      width: 9px;
      height: 9px;
    }
    .call-timer {
      left: 33px;
      top: 34px;
    }
    .call-glow {
      left: 20px;
      right: 20px;
      top: 318px;
      height: 200px;
      border-radius: 30px;
      overflow: hidden;
      filter: blur(25px);
    }
    .call-glow img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .call-avatar {
      top: 343px;
      width: 151px;
      height: 150px;
      border-radius: 75px;
    }
    .call-name {
      top: 501px;
    }
  </style>
</head>
<body>

  <nav class="tab-bar" id="tabBar" hidden>

  <script type="module">
    import { LiquidGlass } from 'https://cdn.jsdelivr.net/npm/@ybouane/liquidglass@1.0.3/dist/index.js';

    const screens = document.querySelectorAll('.screen');
    const homeScreen = document.getElementById('homeScreen');
    const tabBar = document.getElementById('tabBar');
    const tabPill = document.getElementById('tabPill');
    const tabs = [...tabBar.querySelectorAll('.tab')];
    const callTimer = document.getElementById('callTimer');
    let timerId = null;
    let activeIndex = tabs.findIndex((tab) => tab.classList.contains('is-active'));

    // ---------- Liquid Glass 卡片（WebGL shader） ----------
    let glass = null;

    async function startGlass() {
      if (glass || homeScreen.classList.contains('is-hidden')) return;
      try {
        glass = await LiquidGlass.init({
          root: homeScreen,
          glassElements: homeScreen.querySelectorAll('.card'),
          defaults: {
            cornerRadius: 35,
            zRadius: 30,
            refraction: 0.69,
            blurAmount: 0.12,
            chromAberration: 0.05,
            edgeHighlight: 0.12,
            specular: 0.25,
            fresnel: 1,
            saturation: 0.2,
            shadowOpacity: 0.3,
          },
        });
        homeScreen.classList.add('glass-ready');
      } catch (error) {
        console.warn('Liquid Glass 無法啟用，改用一般卡片', error);
      }
    }

    function stopGlass() {
      if (!glass) return;
      glass.destroy();
      glass = null;
      homeScreen.classList.remove('glass-ready');
    }

    // 等進場動畫結束（位置固定）才擷取背景
    homeScreen.addEventListener('animationend', (event) => {
      if (event.target === homeScreen) startGlass();
    });

    function showScreen(id) {
      const current = document.querySelector('.screen:not(.is-hidden)');
      if (current && current.id === id) return;
      if (id !== 'homeScreen') stopGlass();
      screens.forEach((screen) => screen.classList.toggle('is-hidden', screen.id !== id));
      tabBar.hidden = id === 'loginScreen';
      window.scrollTo(0, 0);

      clearInterval(timerId);
      if (id === 'videoScreen') {
        let seconds = 0;
        callTimer.textContent = '00:00';
        timerId = setInterval(() => {
          seconds += 1;
          const mm = String(Math.floor(seconds / 60)).padStart(2, '0');
          const ss = String(seconds % 60).padStart(2, '0');
          callTimer.textContent = `${mm}:${ss}`;
        }, 1000);
      }
    }

    document.getElementById('loginButton').addEventListener('click', () => {
      showScreen('homeScreen');
      placePill(activeIndex);
    });

    const passwordInput = document.getElementById('passwordInput');
    document.getElementById('eyeButton').addEventListener('click', () => {
      passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    });

    // ---------- 底部分頁：點擊或左右滑動 ----------
    function slotWidth() {
      return tabBar.clientWidth / tabs.length;
    }

    function placePill(index) {
      tabPill.style.setProperty('--pill-x', `${index * slotWidth()}px`);
    }

    function selectTab(index) {
      activeIndex = index;
      tabs.forEach((tab, i) => tab.classList.toggle('is-active', i === index));
      placePill(index);
      if (tabs[index].dataset.target) showScreen(tabs[index].dataset.target);
    }

    function indexAt(clientX) {
      const x = clientX - tabBar.getBoundingClientRect().left;
      return Math.max(0, Math.min(tabs.length - 1, Math.floor(x / slotWidth())));
    }

    let dragStartX = null;
    let dragging = false;

    tabBar.addEventListener('pointerdown', (event) => {
      dragStartX = event.clientX;
      dragging = false;
      tabBar.setPointerCapture(event.pointerId);
    });

    tabBar.addEventListener('pointermove', (event) => {
      if (dragStartX === null) return;
      if (!dragging && Math.abs(event.clientX - dragStartX) < 6) return;
      dragging = true;
      tabBar.classList.add('is-dragging');
      // 選取底色跟著手指移動
      const x = event.clientX - tabBar.getBoundingClientRect().left - slotWidth() / 2;
      const maxX = slotWidth() * (tabs.length - 1);
      tabPill.style.setProperty('--pill-x', `${Math.max(0, Math.min(maxX, x))}px`);
      tabs.forEach((tab, i) => tab.classList.toggle('is-active', i === indexAt(event.clientX)));
    });

    function endDrag(event) {
      if (dragStartX === null) return;
      tabBar.classList.remove('is-dragging');
      // 放開時（或單純點擊）吸附到手指所在的分頁
      selectTab(indexAt(event.clientX));
      dragStartX = null;
      dragging = false;
    }

    tabBar.addEventListener('pointerup', endDrag);
    tabBar.addEventListener('pointercancel', (event) => {
      tabBar.classList.remove('is-dragging');
      dragStartX = null;
      selectTab(activeIndex);
    });

    // 鍵盤（Enter / 空白鍵）操作分頁
    tabs.forEach((tab, i) => tab.addEventListener('click', () => selectTab(i)));

    window.addEventListener('resize', () => placePill(activeIndex));
  </script>
</body>
</html>
