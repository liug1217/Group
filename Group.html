<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover：畫到整個螢幕（瀏海、狀態列、底部橫桿底下），再用 env(safe-area-inset-*) 讓開 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- 手機頂部安全區（狀態列）顏色，跟頂部 header 一樣 -->
  <meta name="theme-color" content="#252525">
  <!-- 加入主畫面後用全螢幕 App 開啟；狀態列透明（白字），頂部玻璃延伸到狀態列底下 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Group">
  <title>Group</title>
  <script>
    // iOS 舊版的主畫面 App 不一定支援 display-mode 媒體查詢，用 navigator.standalone 補判斷
    if (window.navigator.standalone) document.documentElement.classList.add('is-standalone');
  </script>
  <style>
    /* 安全區高度：系統依機型給的值；一般 Safari 分頁裡是 0 */
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    /* 加入主畫面（全螢幕）時狀態列蓋在畫面上：頂部至少讓出 Figma 原本的 60px。
       iOS 26 直立模式有時 safe-area-inset-top 會是 0（WebKit Bug 306465），所以不能只靠 env() */
    @media (display-mode: standalone), (display-mode: fullscreen) {
      :root {
        --safe-top: max(env(safe-area-inset-top, 0px), 60px);
      }
    }
    :root.is-standalone {
      --safe-top: max(env(safe-area-inset-top, 0px), 60px);
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #252525;
      font-family: 'SF Pro', 'SF Pro Text', -apple-system, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: #FFFFFF;
      -webkit-tap-highlight-color: transparent;
    }
    /* 畫面跟著螢幕寬度拉長，物件用 left / right 固定兩側留空 */
    .screen {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background: #212121;
      overflow: hidden;
      animation: screen-in 0.3s ease;
    }
    .screen.is-hidden {
      display: none;
    }
    @keyframes screen-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    /* ---------- 載入畫面：圖片和玻璃都準備好才進入 ---------- */
    .splash {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #212121;
      transition: opacity 0.4s ease;
    }
    .splash.is-done {
      opacity: 0;
      pointer-events: none;
    }
    .splash-logo {
      width: 84px;
      height: 84px;
      border-radius: 42px;
      object-fit: cover;
      box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
      animation: splash-pulse 1.4s ease-in-out infinite;
    }
    @keyframes splash-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .splash-bar {
      width: 140px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }
    .splash-bar span {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: 2px;
      background: #FFFFFF;
      transition: width 0.25s ease;
    }
    /* 載入時先把主頁偷偷排版一次（看不到），玻璃就能先算好 */
    .is-warming {
      visibility: hidden !important;
      animation: none !important;
    }
    .abs {
      position: absolute;
    }
    .center-x {
      left: 50%;
      transform: translateX(-50%);
    }
    .shadow {
      box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
    }
    .text-shadow {
      text-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
    }
    .t10 { font-size: 10px; }
    .t12 { font-size: 12px; }
    .t15 { font-size: 15px; }
    .t20 { font-size: 20px; }
    .t30 { font-size: 30px; }
    .nowrap { white-space: nowrap; }
    .avatar {
      position: absolute;
      object-fit: cover;
      box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
    }

    /* ---------- 登入 ---------- */
    /* 跟主頁一樣：玻璃後面放有淡圖案的背景，折射才看得出來 */
    .screen-login {
      background: #212121 url(assets/home-bg.jpg) 0 0 / 100% auto no-repeat;
    }
    .field {
      position: absolute;
      left: 20px;
      right: 20px;
      height: 50px;
      border-radius: 25px;
      background: rgba(65, 65, 65, 0.2);
      box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
      --lg-tint: rgba(65, 65, 65, 0.2);
      --lg-shadow-2: 0px 4px 4px rgba(0, 0, 0, 0.25);
    }
    .field input {
      position: absolute;
      left: 65px;
      right: 60px;
      top: 0;
      height: 50px;
      padding: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: #FFFFFF;
      font: inherit;
      font-size: 15px;
      text-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
    }
    .field input::placeholder {
      color: #FFFFFF;
      opacity: 1;
    }
    .field-account { top: 290px; }
    .field-password { top: 385px; }
    .icon-user { left: 25px; top: 15px; width: 20px; height: 20px; }
    .icon-lock { left: 26px; top: 15px; width: 18px; height: 20px; }
    .eye-button {
      position: absolute;
      right: 21px;
      top: 18px;
      width: 20px;
      height: 13px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .eye-button img {
      display: block;
      width: 20px;
      height: 13px;
    }
    /* 登入按鈕：玻璃外殼（<lg-panel>）+ 裡面一個透明的原生按鈕 */
    .login-button {
      position: absolute;
      left: 20px;
      right: 20px;
      top: 480px;
      height: 50px;
      border-radius: 25px;
      background: #2949CB;
      box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
      transition: transform 0.15s ease;
      --lg-tint: #2949CB;
      --lg-shadow-2: 0px 4px 4px rgba(0, 0, 0, 0.25);
    }
    .login-button:active {
      transform: scale(0.97);
    }
    .login-button > .lg-panel__body {
      position: absolute;
      inset: 0;
    }
    .login-button__el {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      border-radius: 25px;
      background: transparent;
      color: #FFFFFF;
      font: inherit;
      font-size: 15px;
      text-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }
    /* 版本號（登入按鈕上方） */
    .version-label {
      left: 0;
      right: 0;
      top: 452px;
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
    }
    .social {
      top: 575px;
      width: 50px;
      height: 50px;
      border-radius: 25px;
      cursor: pointer;
    }

    /* ---------- 群組主頁 ---------- */
    /* 主頁可以往下滑（Figma 畫面高度 1500 - 60） */
    .screen-home {
      height: calc(1440px + var(--safe-top));
      /* 照 liquidglass.dev：玻璃後面放圖片，折射才看得出來（自己畫的波浪圖，440×1440 @2x） */
      background: #212121 url(assets/home-bg.jpg) 0 0 / 100% 100% no-repeat;
    }
    /* 頂部固定，往下滑時不會跟著捲走；底色用不透明的 #252525（= header 疊在背景上的顏色），內容才不會透出來。
       改成玻璃後，玻璃層本身不透明（背景複本），一樣不會透出捲到下面的卡片 */
    .header {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      /* 頂部延伸到狀態列底下，多出來的高度 = 安全區 */
      height: calc(85px + var(--safe-top));
      background: #252525;
      z-index: 5;
      /* 玻璃顏色 = 原本 Figma 的 rgba(53, 53, 53, 0.2)，疊在 #212121 上就是 #252525 */
      --lg-tint: rgba(53, 53, 53, 0.2);
      --lg-shadow-2: 0px 4px 4px rgba(0, 0, 0, 0.25);
    }
    /* 頂部裡的東西都往下讓出安全區（狀態列） */
    .group-avatar {
      top: var(--safe-top);
      width: 60px;
      height: 60px;
      border-radius: 30px;
    }
    .group-title {
      top: calc(60px + var(--safe-top));
    }
    .header-tag {
      right: 20px;
      top: calc(59px + var(--safe-top));
      width: 50px;
      height: 20px;
      border-radius: 5px;
      background: rgba(217, 217, 217, 0.2);
      --lg-tint: rgba(217, 217, 217, 0.2);
      --lg-shadow-2: 0px 4px 4px rgba(0, 0, 0, 0.25);
    }
    .card {
      position: absolute;
      left: 20px;
      right: 20px;
      border-radius: 35px;
      background: rgba(65, 65, 65, 0.2);
      box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
      /* 玻璃顏色用原本卡片的灰色；陰影照 liquidglass.dev 網站 */
      --lg-tint: rgba(65, 65, 65, 0.2);
      --lg-shadow-2: 0 4px 12px rgba(0, 0, 0, 0.1);
    }
    /* 玻璃裡的背景複本只有玻璃大小，用 background-position 對齊整張背景圖（JS 設定）。
       複本超出玻璃時，iPhone Safari 算濾鏡範圍會把它算進去，玻璃會往右下位移 */
    lg-panel .lg-surface__copy {
      width: 100% !important;
      height: 100% !important;
      transform: none !important;
    }
    /* <lg-panel>（.glass）載入後由玻璃畫底色和陰影；載入失敗時維持各自原本的樣式 */
    .glass:defined {
      background: none;
      box-shadow: none;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }
    /* 頂部變高多少（安全區），卡片就往下移多少 */
    .leader-card {
      top: calc(109px + var(--safe-top));
      height: 150px;
    }
    .leader-avatar {
      left: 10px;
      top: 25px;
      width: 100px;
      height: 100px;
      border-radius: 50px;
    }
    .leader-badge {
      right: 20px;
      top: 10px;
      width: 50px;
      height: 20px;
      border-radius: 8px;
      background: rgba(99, 99, 99, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      --lg-tint: rgba(99, 99, 99, 0.2);
      --lg-shadow-2: 0px 4px 4px rgba(0, 0, 0, 0.25);
    }
    .bio-label {
      left: 240px;
      right: 10px;
      top: 35px;
    }
    .bio-box {
      left: 240px;
      right: 10px;
      top: 54px;
      height: 76px;
      border-radius: 10px;
      background: rgba(99, 99, 99, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      --lg-tint: rgba(99, 99, 99, 0.2);
      --lg-shadow-2: 0px 4px 4px rgba(0, 0, 0, 0.25);
    }
    /* <lg-panel> 會把文字包進 .lg-panel__body；那層要一樣置中，不然預設行高會把小字往下推 */
    .leader-badge > .lg-panel__body,
    .bio-box > .lg-panel__body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rank-card {
      top: calc(283px + var(--safe-top));
      height: 406px;
    }
    .rank-header {
      left: 0;
      right: 0;
      top: 0;
      height: 50px;
      box-sizing: border-box;
      border-bottom: 1px solid #838383;
      border-radius: 35px 35px 0px 0px;
      background: rgba(53, 53, 53, 0.2);
    }
    .divider {
      left: 0;
      right: 0;
      height: 1px;
      background: #838383;
    }
    .member-avatar {
      left: 10px;
      width: 35px;
      height: 35px;
      border-radius: 17.5px;
    }

    /* Tab Bar - iPhone · 五分頁（可點擊也可滑動） */
    .tab-bar {
      position: fixed;
      left: 19px;
      right: 19px;
      /* 一般是 29px（Figma）；有底部橫桿的 iPhone 在主畫面 App 裡，至少讓出橫桿的安全區 */
      bottom: max(29px, var(--safe-bottom));
      height: 70px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border-radius: 1000px;
      background: rgba(242, 242, 247, 0.8);
      -webkit-backdrop-filter: blur(20px) saturate(190%);
      backdrop-filter: blur(20px) saturate(190%);
      box-shadow: 1.25px 0px 0px -0.75px #D0D0D0, -1.25px 0px 0px -0.75px #D0D0D0, 0px 0px 0px 0.5px #E8E8E8, 0px 8px 15px 0px rgba(0, 0, 0, 0.02);
      font-family: 'Inter', 'SF Pro', -apple-system, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      z-index: 10;
      --lg-tint: rgba(242, 242, 247, 0.8);
      --lg-shadow-2: 1.25px 0px 0px -0.75px #D0D0D0, -1.25px 0px 0px -0.75px #D0D0D0, 0px 0px 0px 0.5px #E8E8E8, 0px 8px 15px 0px rgba(0, 0, 0, 0.02);
    }
    .tab-bar[hidden] {
      display: none;
    }
    /* <lg-panel> 會把分頁按鈕包進 .lg-panel__body，五等分排版要放在這一層 */
    .tab-bar > .lg-panel__body {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
    }
    /* 選取底色：用 transform 移動，點擊跟滑動都有動畫 */
    .tab-pill {
      position: absolute;
      left: 2px;
      top: 5px;
      width: calc(20% - 4px);
      height: 60px;
      border-radius: 30px;
      background: rgba(0, 122, 255, 0.4);
      transform: translateX(var(--pill-x, 0px)) scale(var(--pill-scale, 1));
      transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      --lg-tint: rgba(0, 122, 255, 0.4);
      --lg-shadow-2: none;
    }
    /* 選取底色玻璃的「背景」：分頁列的淺灰（rgba(242, 242, 247, 0.8) 疊在深色背景上 ≈ rgb(200, 200, 204)） */
    .tab-surface {
      display: none;
      background: rgb(200, 200, 204);
    }
    .tab-bar.is-dragging .tab-pill {
      --pill-scale: 1.12;
      transition: transform 0.12s ease-out;
    }
    .tab {
      position: relative;
      height: 70px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #1C1C1E;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: color 0.25s ease;
    }
    .tab.is-active {
      color: #007AFF;
    }
    .tab img {
      position: absolute;
      left: 50%;
      top: 14px;
      transform: translateX(-50%);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .tab.is-active img {
      transform: translateX(-50%) scale(1.12);
    }
    .tab span {
      position: absolute;
      left: 50%;
      top: 42px;
      transform: translateX(-50%);
      white-space: nowrap;
    }
    .tab .tab-avatar {
      width: 20px;
      height: 20px;
      border-radius: 50px;
      object-fit: cover;
    }

    /* ---------- VIDEO ---------- */
    /* VIDEO 頁最上面的標題和計時也讓出狀態列 */
    .call-title {
      left: 20px;
      top: calc(15px + var(--safe-top));
    }
    .call-clock {
      left: 21.5px;
      top: calc(35.5px + var(--safe-top));
      width: 9px;
      height: 9px;
    }
    .call-timer {
      left: 33px;
      top: calc(34px + var(--safe-top));
    }
    .call-glow {
      left: 20px;
      right: 20px;
      top: 318px;
      height: 200px;
      border-radius: 30px;
      overflow: hidden;
      filter: blur(25px);
    }
    .call-glow img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .call-avatar {
      top: 343px;
      width: 151px;
      height: 150px;
      border-radius: 75px;
    }
    .call-name {
      top: 501px;
    }
  </style>
</head>
<body>

  <!-- 載入畫面 -->
  <div class="splash" id="splash" role="status" aria-label="載入中">
    <img class="splash-logo" src="assets/group-avatar.jpg" alt="">
    <div class="t12 nowrap text-shadow">★Bi_藍冰團★《Roblox》</div>
    <div class="splash-bar"><span id="splashProgress"></span></div>
  </div>

  <!-- 登入畫面 -->
  <section class="screen screen-login" id="loginScreen" data-lg-backdrop="">
    <lg-panel class="field field-account glass" radius="25">
      <img class="abs icon-user" src="assets/icon-user.svg" alt="">
      <input type="text" placeholder="帳號" aria-label="帳號" autocomplete="username">
    </lg-panel>
    <lg-panel class="field field-password glass" radius="25">
      <img class="abs icon-lock" src="assets/icon-lock.svg" alt="">
      <input type="password" id="passwordInput" placeholder="密碼" aria-label="密碼" autocomplete="current-password">
      <button class="eye-button" id="eyeButton" type="button" aria-label="顯示密碼">
        <img src="assets/icon-eye.svg" alt="">
      </button>
    </lg-panel>
    <div class="abs version-label t12 nowrap">ESN v1.0.6</div>
    <lg-panel class="login-button glass" radius="25">
      <button class="login-button__el" id="loginButton" type="button">登入</button>
    </lg-panel>
    <img class="abs social shadow" style="left: 20px;" src="assets/login-line.png" alt="LINE 登入">
    <img class="abs social shadow" style="left: 80px;" src="assets/login-google.jpg" alt="Google 登入">
    <img class="abs social shadow" style="left: 140px;" src="assets/login-facebook.png" alt="Facebook 登入">
    <img class="abs social shadow" style="left: 200px;" src="assets/login-instagram.jpg" alt="Instagram 登入">
  </section>

  <!-- 群組主頁 -->
  <!-- data-lg-backdrop：玻璃折射主頁自己的 CSS 背景（背景圖），Safari / Firefox 也能真的折射 -->
  <section class="screen screen-home is-hidden" id="homeScreen" data-lg-backdrop="">
    <!-- 頂部固定在畫面上、卡片會捲到它底下：backdrop="none" 讓玻璃透出底下真正的內容
         （Chrome 會折射；iPhone Safari 會是毛玻璃，這是 Safari 的限制） -->
    <lg-panel class="header glass shadow" radius="0" backdrop="none">
      <img class="avatar group-avatar center-x" src="assets/group-avatar.jpg" alt="">
      <div class="abs group-title center-x t12 nowrap text-shadow">★Bi_藍冰團★《Roblox》</div>
      <lg-panel class="abs header-tag glass shadow" radius="5"></lg-panel>
    </lg-panel>

    <!-- 團長卡片 -->
    <lg-panel class="card glass leader-card" radius="35">
      <img class="avatar leader-avatar" src="assets/member-5.jpg" alt="">
      <div class="abs t15 nowrap text-shadow" style="left: 130px; top: 35px;">帆～</div>
      <div class="abs t15 nowrap text-shadow" style="left: 130px; top: 53px;">Bi_wuda0823</div>
      <div class="abs t12 nowrap text-shadow" style="left: 130px; top: 71px;">Roblox競爭者等級</div>
      <div class="abs t12 nowrap text-shadow" style="left: 130px; top: 86px;">180</div>
      <div class="abs bio-label t12 nowrap">個人簡介 :</div>
      <lg-panel class="abs bio-box glass shadow" radius="10"><span class="t30">無</span></lg-panel>
      <lg-panel class="abs leader-badge glass shadow" radius="8"><span class="t12">團長</span></lg-panel>
    </lg-panel>

    <!-- 排名表 -->
    <lg-panel class="card glass rank-card" radius="35">
      <div class="abs rank-header shadow"></div>
      <div class="abs t15 nowrap text-shadow" style="left: 60px; top: 16px;">競爭者</div>
      <div class="abs center-x t20 nowrap text-shadow" style="top: 13px;">排名表</div>
      <div class="abs t15 nowrap text-shadow" style="right: 60px; top: 16px;">狙擊手</div>

      <div class="abs divider shadow" style="top: 100px;"></div>
      <div class="abs divider shadow" style="top: 151px;"></div>
      <div class="abs divider shadow" style="top: 202px;"></div>
      <div class="abs divider shadow" style="top: 253px;"></div>

  <!-- Liquid Glass：liquidglass.dev v1.0.0（MIT，gentpan），檔案放在 assets/lib -->
  <script type="module" src="assets/lib/components.js"></script>
  <script>
    const screens = document.querySelectorAll('.screen');
    const tabBar = document.getElementById('tabBar');
    const tabPill = document.getElementById('tabPill');
    const tabs = [...tabBar.querySelectorAll('.tab')];
    const callTimer = document.getElementById('callTimer');
    let timerId = null;
    let activeIndex = tabs.findIndex((tab) => tab.classList.contains('is-active'));

    // iPhone Safari 會暫存玻璃濾鏡的結果：畫面從隱藏變顯示、進場動畫移動元件後，
    // 玻璃會停在舊位置（位移）。動畫結束、轉向或從背景回來時重建看得到的玻璃，換新的濾鏡 id 重畫。
    function refreshGlass() {
      document.querySelectorAll('lg-panel').forEach((panel) => {
        if (!panel.surface || !panel.offsetWidth) return;
        panel.surface.detach();
        panel.surface.attach();
      });
      alignGlassBackdrop();
    }

    // 背景的 background-size（例如 100% auto）換成 px，給只有玻璃大小的複本用
    function backdropSize(source, rect) {
      const [w, h = w] = getComputedStyle(source).backgroundSize.split(' ');
      const toPx = (value, length) => (value.endsWith('%') ? `${(parseFloat(value) / 100) * length}px` : value);
      return `${toPx(w, rect.width)} ${toPx(h, rect.height)}`;
    }

    // 玻璃裡的背景複本只有玻璃大小（CSS 固定），這裡用 background-size / position
    // 讓它顯示背景圖中、剛好在玻璃後面的那一塊，折射才對得上
    function alignGlassBackdrop() {
      document.querySelectorAll('lg-panel').forEach((panel) => {
        const surface = panel.surface;
        if (!surface || !surface.copy || !surface.source) return;
        const source = surface.source.getBoundingClientRect();
        if (!source.width) return; // 背景所在的畫面目前隱藏
        const r = surface.copy.getBoundingClientRect();
        surface.copy.style.backgroundSize = backdropSize(surface.source, source);
        surface.copy.style.backgroundPosition = `${source.left - r.left}px ${source.top - r.top}px`;
      });
    }

    // 頂部只要底部的玻璃邊：玻璃往上、左、右多延伸 60px 到螢幕外，那三邊的邊框就看不到
    customElements.whenDefined('lg-panel').then(() => {
      const header = document.querySelector('.header');
      header.surface?.setDelta({ x: -60, y: -60, w: 120, h: 60 });
      // 元件剛升級成玻璃（登入畫面一打開就看得到），對齊一次背景
      requestAnimationFrame(alignGlassBackdrop);
    });
    window.addEventListener('resize', () => requestAnimationFrame(alignGlassBackdrop));
    // 頂部和分頁列是固定位置，捲動時背後的那塊背景會變，要跟著對齊
    let alignFrame = 0;
    window.addEventListener('scroll', () => {
      if (alignFrame) return;
      alignFrame = requestAnimationFrame(() => {
        alignFrame = 0;
        alignGlassBackdrop();
      });
    }, { passive: true });
    screens.forEach((screen) => {
      screen.addEventListener('animationend', (event) => {
        if (event.target === screen) refreshGlass();
      });
    });
    window.addEventListener('orientationchange', () => setTimeout(refreshGlass, 300));
    window.addEventListener('pageshow', refreshGlass);

    function showScreen(id) {
      const current = document.querySelector('.screen:not(.is-hidden)');
      if (current && current.id === id) return;
      screens.forEach((screen) => screen.classList.toggle('is-hidden', screen.id !== id));
      tabBar.hidden = id === 'loginScreen';
      window.scrollTo(0, 0);

      clearInterval(timerId);
      if (id === 'videoScreen') {
        let seconds = 0;
        callTimer.textContent = '00:00';
        timerId = setInterval(() => {
          seconds += 1;
          const mm = String(Math.floor(seconds / 60)).padStart(2, '0');
          const ss = String(seconds % 60).padStart(2, '0');
          callTimer.textContent = `${mm}:${ss}`;
        }, 1000);
      }
    }

    document.getElementById('loginButton').addEventListener('click', () => {
      showScreen('homeScreen');
      placePill(activeIndex);
    });

    const passwordInput = document.getElementById('passwordInput');
    document.getElementById('eyeButton').addEventListener('click', () => {
      passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    });

    // ---------- 底部分頁：點擊或左右滑動 ----------
    function slotWidth() {
      return tabBar.clientWidth / tabs.length;
    }

    function placePill(index) {
      tabPill.style.setProperty('--pill-x', `${index * slotWidth()}px`);
    }

    function selectTab(index) {
      activeIndex = index;
      tabs.forEach((tab, i) => tab.classList.toggle('is-active', i === index));
      placePill(index);
      if (tabs[index].dataset.target) showScreen(tabs[index].dataset.target);
    }

    function indexAt(clientX) {
      const x = clientX - tabBar.getBoundingClientRect().left;
      return Math.max(0, Math.min(tabs.length - 1, Math.floor(x / slotWidth())));
    }

    let dragStartX = null;
    let dragging = false;

    tabBar.addEventListener('pointerdown', (event) => {
      dragStartX = event.clientX;
      dragging = false;
      tabBar.setPointerCapture(event.pointerId);
    });

    tabBar.addEventListener('pointermove', (event) => {
      if (dragStartX === null) return;
      if (!dragging && Math.abs(event.clientX - dragStartX) < 6) return;
      dragging = true;
      tabBar.classList.add('is-dragging');
      // 選取底色跟著手指移動
      const x = event.clientX - tabBar.getBoundingClientRect().left - slotWidth() / 2;
      const maxX = slotWidth() * (tabs.length - 1);
      tabPill.style.setProperty('--pill-x', `${Math.max(0, Math.min(maxX, x))}px`);
      tabs.forEach((tab, i) => tab.classList.toggle('is-active', i === indexAt(event.clientX)));
    });

    function endDrag(event) {
      if (dragStartX === null) return;
      tabBar.classList.remove('is-dragging');
      // 放開時（或單純點擊）吸附到手指所在的分頁
      selectTab(indexAt(event.clientX));
      dragStartX = null;
      dragging = false;
    }

    tabBar.addEventListener('pointerup', endDrag);
    tabBar.addEventListener('pointercancel', (event) => {
      tabBar.classList.remove('is-dragging');
      dragStartX = null;
      selectTab(activeIndex);
    });

    // 鍵盤（Enter / 空白鍵）操作分頁
    tabs.forEach((tab, i) => tab.addEventListener('click', () => selectTab(i)));

    window.addEventListener('resize', () => placePill(activeIndex));

    // ---------- 載入畫面：先把圖片和玻璃都準備好 ----------
    const splash = document.getElementById('splash');
    const splashProgress = document.getElementById('splashProgress');
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const warmHome = document.getElementById('homeScreen');

    // 預熱結束：不管成功、失敗或逾時，都把主頁和分頁列藏回去（只做一次）
    function finishWarm() {
      if (!warmHome.classList.contains('is-warming')) return;
      warmHome.classList.add('is-hidden');
      warmHome.classList.remove('is-warming');
      tabBar.hidden = true;
      tabBar.classList.remove('is-warming');
    }

    // 主頁先偷偷排版一次（看不到），讓玻璃算好位移圖；之後進主頁會直接用快取，不用等
    async function warmGlass() {
      const home = warmHome;
      home.classList.add('is-warming');
      home.classList.remove('is-hidden');
      tabBar.classList.add('is-warming');
      tabBar.hidden = false;
      await wait(60);
      alignGlassBackdrop();
      // 等所有主頁玻璃的濾鏡都套上（最多 2 秒）
      const panels = [...home.querySelectorAll('lg-panel'), ...tabBar.querySelectorAll('lg-panel')]
        .filter((panel) => panel.surface?.mode === 'copy');
      const until = performance.now() + 2000;
      while (performance.now() < until) {
        const ready = panels.every((panel) => getComputedStyle(panel.querySelector('.lg-surface__glass')).filter !== 'none');
        if (ready) break;
        await wait(50);
      }
      finishWarm();
    }

    async function preload() {
      const urls = [...new Set([
        ...[...document.images].map((img) => img.src),
        new URL('assets/home-bg.jpg', location.href).href,
      ])];
      const total = urls.length + 2;
      let done = 0;
      const tick = () => {
        done += 1;
        splashProgress.style.width = `${Math.min(100, (done / total) * 100)}%`;
      };
      await Promise.all(urls.map((url) => new Promise((resolve) => {
        const img = new Image();
        img.onload = img.onerror = () => { tick(); resolve(); };
        img.src = url;
      })));
      await Promise.race([customElements.whenDefined('lg-panel'), wait(4000)]);
      tick();
      await warmGlass();
      refreshGlass();
      tick();
    }

    // 最多等 8 秒，就算有東西載不到也會進入
    Promise.race([preload(), wait(8000)]).finally(async () => {
      finishWarm();
      await wait(200);
      splash.classList.add('is-done');
      setTimeout(() => splash.remove(), 500);
    });
  </script>
