<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <!-- 畫布固定 440px 寬（Figma iPhone 16 Pro Max），手機會自動等比縮放 -->
  <meta name="viewport" content="width=440">
  <!-- 手機頂部安全區（狀態列）顏色，跟頂部 header 一樣 -->
  <meta name="theme-color" content="#252525">
  <title>Group</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #252525;
      font-family: 'SF Pro', 'SF Pro Text', -apple-system, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: #FFFFFF;
    }
    /* 每個畫面都是 440px 寬的 iPhone 畫布 */
    .screen {
      position: relative;
      width: 440px;
      height: 896px;
      margin: 0 auto;
      background: #212121;
      overflow: hidden;
    }
    .screen.is-hidden {
      display: none;
    }
    .abs {
      position: absolute;
    }
    .shadow {
      box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
    }
    .text-shadow {
      text-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
    }
    .t10 { font-size: 10px; }
    .t12 { font-size: 12px; }
    .t15 { font-size: 15px; }
    .t20 { font-size: 20px; }
    .t30 { font-size: 30px; }
    .nowrap { white-space: nowrap; }
    .avatar {
      position: absolute;
      object-fit: cover;
      box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
    }

    /* ---------- iPhone 16 & 17 Pro Max - 2：登入 ---------- */
    .field {
      position: absolute;
      left: 20px;
      width: 400px;
      height: 50px;
      border-radius: 25px;
      background: rgba(65, 65, 65, 0.2);
      box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
    }
    .field input {
      position: absolute;
      left: 65px;
      right: 60px;
      top: 0;
      height: 50px;
      padding: 0;
      border: 0;
      outline: none;
      background: transparent;
      color: #FFFFFF;
      font: inherit;
      font-size: 15px;
      text-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
    }
    .field input::placeholder {
      color: #FFFFFF;
      opacity: 1;
    }
    .field-account { top: 290px; }
    .field-password { top: 385px; }
    .icon-user { left: 25px; top: 15px; width: 20px; height: 20px; }
    .icon-lock { left: 26px; top: 15px; width: 18px; height: 20px; }
    .eye-button {
      position: absolute;
      left: 359px;
      top: 18px;
      width: 20px;
      height: 13px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .eye-button img {
      display: block;
      width: 20px;
      height: 13px;
    }
    .login-button {
      position: absolute;
      left: 20px;
      top: 480px;
      width: 400px;
      height: 50px;
      border: 0;
      border-radius: 25px;
      background: #2949CB;
      box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
      color: #FFFFFF;
      font: inherit;
      font-size: 15px;
      text-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }
    .social {
      top: 575px;
      width: 50px;
      height: 50px;
      border-radius: 25px;
      cursor: pointer;
    }

    /* ---------- iPhone 16 & 17 Pro Max - 1：群組主頁 ---------- */
    .screen-home {
      height: 1440px;
    }
    .header {
      left: 0;
      top: 0;
      width: 440px;
      height: 85px;
      background: rgba(53, 53, 53, 0.2);
    }
    .group-avatar {
      left: 190px;
      top: 0px;
      width: 60px;
      height: 60px;
      border-radius: 30px;
    }
    .group-title {
      left: 219.5px;
      top: 60px;
      transform: translateX(-50%);
    }
    .header-tag {
      left: 370px;
      top: 59px;
      width: 50px;
      height: 20px;
      border-radius: 5px;
      background: rgba(217, 217, 217, 0.2);
    }
    .card {
      position: absolute;
      left: 20px;
      width: 400px;
      border-radius: 35px;
      background: rgba(65, 65, 65, 0.2);
      box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
    }
    .leader-card {
      top: 109px;
      height: 150px;
    }
    .leader-avatar {
      left: 10px;
      top: 25px;
      width: 100px;
      height: 100px;
      border-radius: 50px;
    }
    .leader-badge {
      left: 330px;
      top: 10px;
      width: 50px;
      height: 20px;
      border-radius: 8px;
      background: rgba(99, 99, 99, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bio-box {
      left: 240px;
      top: 54px;
      width: 150px;
      height: 76px;
      border-radius: 10px;
      background: rgba(99, 99, 99, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rank-card {
      top: 283px;
      height: 406px;
    }
    .rank-header {
      left: 0;
      top: 0;
      width: 400px;
      height: 50px;
      box-sizing: border-box;
      border-bottom: 1px solid #838383;
      border-radius: 35px 35px 0px 0px;
      background: rgba(53, 53, 53, 0.2);
    }
    .divider {
      left: 0;
      width: 400px;
      height: 1px;
      background: #838383;
    }
    .member-avatar {
      left: 10px;
      width: 35px;
      height: 35px;
      border-radius: 17.5px;
    }

    /* Tab Bar - iPhone · 五分頁 */
    .tab-bar {
      position: fixed;
      left: 50%;
      bottom: 29px;
      width: 402px;
      height: 70px;
      margin-left: -201px;
      border-radius: 1000px;
      background: rgba(242, 242, 247, 0.8);
      -webkit-backdrop-filter: blur(20px) saturate(190%);
      backdrop-filter: blur(20px) saturate(190%);
      box-shadow: 1.25px 0px 0px -0.75px #D0D0D0, -1.25px 0px 0px -0.75px #D0D0D0, 0px 0px 0px 0.5px #E8E8E8, 0px 8px 15px 0px rgba(0, 0, 0, 0.02);
      font-family: 'Inter', 'SF Pro', -apple-system, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      z-index: 10;
    }
    .tab-bar[hidden] {
      display: none;
    }
    .tab {
      position: absolute;
      top: 5px;
      width: 76px;
      height: 60px;
      padding: 0;
      border: 0;
      border-radius: 30px;
      background: transparent;
      color: #1C1C1E;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .tab.is-active {
      background: rgba(0, 122, 255, 0.4);
      color: #007AFF;
    }
    .tab img {
      position: absolute;
      left: 50%;
      top: 9px;
      transform: translateX(-50%);
    }
    .tab span {
      position: absolute;
      left: 50%;
      top: 37px;
      transform: translateX(-50%);
      white-space: nowrap;
    }
    .tab .tab-avatar {
      width: 20px;
      height: 20px;
      border-radius: 50px;
      object-fit: cover;
    }

    /* ---------- iPhone 16 & 17 Pro Max - 3：VIDEO ---------- */
    .call-title {
      left: 90.5px;
      top: 15px;
      transform: translateX(-50%);
    }
    .call-clock {
      left: 21.5px;
      top: 35.5px;
      width: 9px;
      height: 9px;
    }
    .call-timer {
      left: 47.5px;
      top: 34px;
      transform: translateX(-50%);
    }
    .call-glow {
      left: 20px;
      top: 318px;
      width: 400px;
      height: 200px;
      border-radius: 30px;
      object-fit: cover;
      filter: blur(25px);
    }
    .call-avatar {
      left: 144px;
      top: 343px;
      width: 151px;
      height: 150px;
      border-radius: 75px;
    }
  </style>
</head>
<body>

  <!-- 登入畫面 -->
  <section class="screen screen-login" id="loginScreen">
    <div class="field field-account">
      <img class="abs icon-user" src="assets/icon-user.svg" alt="">
      <input type="text" placeholder="帳號" aria-label="帳號" autocomplete="username">

    <div class="field field-password">
      <img class="abs icon-lock" src="assets/icon-lock.svg" alt="">
      <input type="password" id="passwordInput" placeholder="密碼" aria-label="密碼" autocomplete="current-password">
      <button class="eye-button" id="eyeButton" type="button" aria-label="顯示密碼">

    </div>
    <button class="login-button" id="loginButton" type="button">登入</button>

    <img class="abs social shadow" style="left: 80px;" src="assets/login-google.jpg" alt="Google 登入">
    <img class="abs social shadow" style="left: 140px;" src="assets/login-facebook.png" alt="Facebook 登入">
    <img class="abs social shadow" style="left: 200px;" src="assets/login-instagram.jpg" alt="Instagram 登入">

  <!-- 群組主頁 -->

    <!-- 團長卡片 -->
    <div class="card leader-card">
      <img class="avatar leader-avatar" src="assets/member-5.jpg" alt="">

      <div class="abs t12 nowrap text-shadow" style="left: 130px; top: 86px;">180</div>
      <div class="abs t12 nowrap" style="left: 240px; top: 35px;">個人簡介 :</div>

    <!-- 排名表 -->
    <div class="card rank-card">

      <div class="abs divider shadow" style="top: 100px;"></div>

      <div class="abs divider shadow" style="top: 202px;"></div>
      <div class="abs divider shadow" style="top: 253px;"></div>
      <div class="abs divider shadow" style="top: 304px;"></div>
      <div class="abs divider shadow" style="top: 355px;"></div>

      <img class="avatar member-avatar" style="top: 57.5px;" src="assets/member-1.jpg" alt="">
      <div class="abs t15 nowrap text-shadow" style="left: 60px; top: 58.5px;">陳柏安 Bi_koimpkj</div>
      <div class="abs t12 nowrap text-shadow" style="left: 60px; top: 76.5px;">Roblox競爭者等級 : 207</div>

      <img class="avatar member-avatar" style="top: 108.5px;" src="assets/member-2.jpg" alt="">
      <div class="abs t15 nowrap text-shadow" style="left: 60px; top: 109.5px;">張 O 寧 Bi_VIP1124</div>
      <div class="abs t12 nowrap text-shadow" style="left: 60px; top: 127.5px;">Roblox競爭者等級 : 159</div>

      <img class="avatar member-avatar" style="top: 159.5px;" src="assets/member-3.jpg" alt="">
      <div class="abs t15 nowrap text-shadow" style="left: 60px; top: 160.5px;">劉 O 佑 Bi_liug1217</div>
      <div class="abs t12 nowrap text-shadow" style="left: 60px; top: 178.5px;">Roblox競爭者等級 : 87</div>

      <img class="avatar member-avatar" style="top: 210.5px;" src="assets/member-4.jpg" alt="">
      <div class="abs t15 nowrap text-shadow" style="left: 60px; top: 211.5px;">劉思妤 Bi_Robbyg309bbb</div>
      <div class="abs t12 nowrap text-shadow" style="left: 60px; top: 229.5px;">Roblox競爭者等級 : 128</div>

      <img class="avatar member-avatar" style="top: 261.5px;" src="assets/member-5.jpg" alt="">

  </section>

  <!-- VIDEO -->
  <section class="screen screen-video is-hidden" id="videoScreen">
    <div class="abs call-title t12 nowrap text-shadow">★Bi_藍冰團★《Roblox》</div>
    <img class="abs call-clock" src="assets/icon-clock.svg" alt="">
    <div class="abs call-timer t10 nowrap" id="callTimer">00:00</div>
    <img class="abs call-glow shadow" src="assets/member-5.jpg" alt="">
    <img class="avatar call-avatar" src="assets/member-5.jpg" alt="">

  </section>

  <nav class="tab-bar" id="tabBar" hidden>
    <button class="tab" style="left: 2.2px;" data-target="homeScreen" type="button">
      <img src="assets/icon-home.svg" alt="" width="20" height="20"><span>主頁</span>
    </button>
    <button class="tab" style="left: 82.6px;" type="button">
      <img src="assets/icon-chat.svg" alt="" width="19" height="19"><span>聊天</span>
    </button>
    <button class="tab" style="left: 163px;" data-target="videoScreen" type="button">
      <img src="assets/icon-video.svg" alt="" width="21" height="21"><span>VIDEO</span>
    </button>
    <button class="tab" style="left: 243.4px;" type="button">
      <img src="assets/icon-bell.svg" alt="" width="21" height="21"><span>通知</span>
    </button>
    <button class="tab is-active" style="left: 323px;" data-target="homeScreen" type="button">
      <img class="tab-avatar" src="assets/member-3.jpg" alt=""><span>我的</span>
    </button>
  </nav>

  <script>
    const screens = document.querySelectorAll('.screen');
    const tabBar = document.getElementById('tabBar');
    const tabs = tabBar.querySelectorAll('.tab');
    const callTimer = document.getElementById('callTimer');
    let timerId = null;

    function showScreen(id) {
      screens.forEach((screen) => screen.classList.toggle('is-hidden', screen.id !== id));
      tabBar.hidden = id === 'loginScreen';
      window.scrollTo(0, 0);

      clearInterval(timerId);
      if (id === 'videoScreen') {
        let seconds = 0;
        callTimer.textContent = '00:00';
        timerId = setInterval(() => {
          seconds += 1;
          const mm = String(Math.floor(seconds / 60)).padStart(2, '0');
          const ss = String(seconds % 60).padStart(2, '0');
          callTimer.textContent = `${mm}:${ss}`;
        }, 1000);
      }
    }

    document.getElementById('loginButton').addEventListener('click', () => showScreen('homeScreen'));

    const passwordInput = document.getElementById('passwordInput');
    document.getElementById('eyeButton').addEventListener('click', () => {
      passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
    });

    tabs.forEach((tab) => {
      tab.addEventListener('click', () => {
        if (!tab.dataset.target) return;
        tabs.forEach((t) => t.classList.toggle('is-active', t === tab));
        showScreen(tab.dataset.target);
      });
    });
  </script>
</body>
</html>
